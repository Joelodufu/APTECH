<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Lesson</title>
</head>
<body>
    <table>
        <caption>Products</caption>
        <thead>
            <tr>
               <th>S/N</th>
               <th>Product Name</th>
               <th>Price</th>
               <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>HP 20000</td>
                <td>$200.00</td>
                <td>20</td>
            </tr>
            <tr>
                <td>2</td>
                <td>HP 25000</td>
                <td>$250.00</td>
                <td>15</td>
            </tr>
            <tr>
                <td>3</td>
                <td>HP 30000</td>
                <td>$300.00</td>
                <td>20</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total</td>
                <td>55</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
